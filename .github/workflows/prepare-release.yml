name: Prepare release

on:
  workflow_dispatch:
    inputs:
      project:
        description: project
        type: choice
        required: true
        options: [glass]
      version:
        description: version
        type: string
        required: true
      baseline:
        description: baseline
        type: string
      dry_run:
        description: dry_run
        type: boolean
        default: true

permissions:
  contents: write
  actions: write
  pull-requests: read
  issues: read

concurrency:
  group: release-preparation
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/glass/1.21.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: glass/1.21.1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Collect release notes and update files
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PROJECT: ${{ inputs.project }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BASELINE: ${{ inputs.baseline }}
        run: |
          args=(--project "$RELEASE_PROJECT" --version "$RELEASE_VERSION" --write)
          if [[ -n "$RELEASE_BASELINE" ]]; then args+=(--from "$RELEASE_BASELINE"); fi
          node .github/scripts/prepare-release.mjs "${args[@]}"
          git diff --check
          git diff -- "$RELEASE_PROJECT/mod.properties" "$RELEASE_PROJECT/CHANGELOG.md"
      - name: Build and validate publishing
        env:
          RELEASE_PROJECT: ${{ inputs.project }}
        run: bash ./gradlew --no-daemon --build-cache ":$RELEASE_PROJECT:publishMods" -x ":$RELEASE_PROJECT:publishGithub" -PpublishDryRun=true -Pglass.publishMinecraftVersions=1.21.1 -Pglass.publishType=beta
      - name: Commit and push release tag
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_PROJECT: ${{ inputs.project }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_HEAD: ${{ steps.release.outputs.head }}
        run: |
          remote_head=$(git ls-remote origin refs/heads/glass/1.21.1 | cut -f1)
          test "$remote_head" = "$RELEASE_HEAD" || { echo 'glass/1.21.1 advanced; rerun preparation.'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$RELEASE_PROJECT/mod.properties" "$RELEASE_PROJECT/CHANGELOG.md"
          git commit -m "Release $RELEASE_TAG"
          git tag "$RELEASE_TAG"
          git push --atomic origin HEAD:refs/heads/glass/1.21.1 "refs/tags/$RELEASE_TAG"
      - name: Start publishing
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh workflow run release.yml --ref "$RELEASE_TAG" --field "tag=$RELEASE_TAG"
