name: Prepare release

on:
  workflow_dispatch:
    inputs:
      project:
        description: project
        type: choice
        required: true
        options: [sounds, mru, shields, fog, glass]
      version:
        description: version
        type: string
        required: true
      baseline:
        description: baseline
        type: string
      dry_run:
        description: dry_run
        type: boolean
        default: true

permissions:
  contents: write
  actions: write
  pull-requests: read
  issues: read

concurrency:
  group: release-preparation-${{ inputs.project }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Collect release notes and update files
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PROJECT: ${{ inputs.project }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BASELINE: ${{ inputs.baseline }}
        run: |
          args=(--project "$RELEASE_PROJECT" --version "$RELEASE_VERSION" --write)
          if [[ -n "$RELEASE_BASELINE" ]]; then args+=(--from "$RELEASE_BASELINE"); fi
          node .github/scripts/prepare-release.mjs "${args[@]}"
          git diff --check
          git diff -- "$RELEASE_PROJECT/mod.properties" "$RELEASE_PROJECT/CHANGELOG.md"
      - name: Build and validate publishing
        env:
          RELEASE_PROJECT: ${{ inputs.project }}
        run: bash ./gradlew --no-daemon --build-cache ":$RELEASE_PROJECT:publishMods" -PpublishDryRun=true
      - name: Commit and push release tag
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_PROJECT: ${{ inputs.project }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_HEAD: ${{ steps.release.outputs.head }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$RELEASE_PROJECT/mod.properties" "$RELEASE_PROJECT/CHANGELOG.md"
          git commit -m "Release $RELEASE_TAG"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git diff --quiet "$RELEASE_HEAD" origin/main -- "$RELEASE_PROJECT" build-logic gradle settings.gradle.kts build.gradle.kts stonecutter.gradle.kts gradle.properties .github; then
              echo "main changed $RELEASE_PROJECT or shared build files since preparation; rerun preparation."
              exit 1
            fi
            git rebase origin/main
            git tag -f "$RELEASE_TAG"
            if git push --atomic origin HEAD:refs/heads/main "refs/tags/$RELEASE_TAG"; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
      - name: Start publishing
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh workflow run release.yml --ref "$RELEASE_TAG" --field "tag=$RELEASE_TAG"
