name: Release

on:
  push:
    tags:
      - glass/v*
  workflow_dispatch:
    inputs:
      tag:
        description: tag
        type: string
        required: true
      platforms:
        description: platforms
        type: choice
        default: all
        options: [all, modrinth, curseforge]

permissions:
  contents: write

concurrency:
  group: monorepo-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            glass/v*) ;;
            *) echo 'Expected a glass/v release tag'; exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          echo "RELEASE_MOD=${RELEASE_TAG%%/*}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and publish glass for 1.21.1
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_PLATFORMS: ${{ inputs.platforms || 'all' }}
        run: |
          test "$RELEASE_MOD" = glass
          skip=(-x :glass:publishGithub)
          case "$RELEASE_PLATFORMS" in
            modrinth) skip+=(-x :glass:publishCurseforge1_21_1Fabric -x :glass:publishCurseforge1_21_1NeoForge) ;;
            curseforge) skip+=(-x :glass:publishModrinth1_21_1Fabric -x :glass:publishModrinth1_21_1NeoForge) ;;
          esac
          GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RELEASE_TAG" GITHUB_SHA="$(git rev-parse HEAD)" bash ./gradlew --no-daemon --build-cache :glass:publishMods "${skip[@]}" -Pglass.publishMinecraftVersions=1.21.1 -Pglass.publishType=beta
